name: BrainBytes Deploy

on:
  workflow_run:
    workflows: ["BrainBytes CI/CD"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (default: latest)'
        required: false
        default: 'latest'

jobs:
  deploy:
    name: Deploy Stack to an Environment
    runs-on: ubuntu-latest
    environment: production
    if: |
      github.event.workflow_run.event == 'push' && 
      github.event.workflow_run.head_branch == 'main' && 
      github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${{ github.event.workflow_run.head_sha }}" 
            TAG=${TAG:0:7}
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Trigger Backend Render Deployment with Registry Image
        run: |
          echo "Deploying backend with image tag: ${{ steps.image-tag.outputs.tag }}"
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          RESPONSE=$(curl -s -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}&imgURL=ghcr.io/$OWNER_LOWER/brainbytes-backend:${{ steps.image-tag.outputs.tag }}")

          echo "Render response: $RESPONSE"
          if [[ "$RESPONSE" != *"deploy"* ]]; then
            echo "Error: Render rejected the deployment."
            exit 1
          fi

      - name: Trigger Frontend Render Deployment with Registry Image
        run: |
          echo "Deploying frontend with image tag: ${{ steps.image-tag.outputs.tag }}"
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          RESPONSE=$(curl -s -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}&imgURL=ghcr.io/$OWNER_LOWER/brainbytes-frontend:${{ steps.image-tag.outputs.tag }}")

          echo "Render response: $RESPONSE"
          if [[ "$RESPONSE" != *"deploy"* ]]; then
            echo "Error: Render rejected the deployment."
            exit 1
          fi

      - name: Verify Live Backend Deployment
        run: |
          echo "Waiting for Backend to spin up on Render..."
          for i in {1..12}; do 
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://brainbytes-zovh.onrender.com/health || echo "000")
            
            if [ "$STATUS" = "200" ]; then
              echo "Success! The backend is live and healthy."
              exit 0
            fi
            
            echo "Backend Attempt $i: Status is $STATUS. Waiting 30 seconds..."
            sleep 30
          done
          
          echo "Error: Backend failed to start within 6 minutes."
          exit 1

      - name: Verify Live Frontend Deployment
        run: |
          echo "Waiting for Frontend to spin up on Render..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://devops-fe-4m5i.onrender.com/ || echo "000")
            
            if [ "$STATUS" = "200" ]; then
              echo "Success! The frontend is live and healthy."
              exit 0
            fi
            
            echo "Frontend Attempt $i: Status is $STATUS. Waiting 30 seconds..."
            sleep 30
          done
          
          echo "Error: Frontend failed to start within 6 minutes."
          exit 1

      - name: Record deployment metadata
        if: always()
        run: |
          mkdir -p deployment-logs
          cat > deployment-logs/deployment-${{ github.run_id }}.json <<EOF
          {
            "workflow_run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "image_tag": "${{ steps.image-tag.outputs.tag }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "deployed_by": "${{ github.actor }}",
            "status": "success",
            "backend_url": "https://brainbytes-zovh.onrender.com",
            "frontend_url": "https://devops-fe-4m5i.onrender.com"
          }
          EOF
          cat deployment-logs/deployment-${{ github.run_id }}.json

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: deployment-logs/
          retention-days: 90

      - name: Notify deployment success
        if: success()
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "✓ Deployment completed successfully at $(date)"
          echo "Images deployed:"
          echo "  - Backend: ghcr.io/$OWNER_LOWER/brainbytes-backend:${{ steps.image-tag.outputs.tag }}"
          echo "  - Frontend: ghcr.io/$OWNER_LOWER/brainbytes-frontend:${{ steps.image-tag.outputs.tag }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "✗ Deployment failed"
          echo "Check logs above for details"
          exit 1