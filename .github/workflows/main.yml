name: BrainBytes CI/CD

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

jobs:
  lint-and-scan:
    name: Lint Code and Scan Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      # Lint code
      - name: Lint frontend code
        working-directory: ./frontend
        run: |
          npm run lint || echo "Frontend linting failed but continuing workflow"
      
      - name: Lint backend code
        working-directory: ./backend
        run: |
          npm run lint || echo "Backend linting failed but continuing workflow"

      # Scan for vulnerabilities
      - name: Check frontend for vulnerabilities
        run: npm audit --json || true
        working-directory: ./frontend
        
      - name: Run Snyk on frontend to check for vulnerabilities
        uses: snyk/actions/node@master
        with:
            args: --file=frontend/package.json --severity-threshold=high
        env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Check backend for vulnerabilities
        run: npm audit --json || true
        working-directory: ./backend
        
      - name: Run Snyk on backend to check for vulnerabilities
        uses: snyk/actions/node@master
        with:
            args: --file=backend/package.json --severity-threshold=high
        env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  test:
    name: Run Tests
    needs: lint-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Start backend services
        run: docker compose up -d --build backend
        
      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          ATTEMPTS=0
          MAX_ATTEMPTS=30
          
          until curl -s http://localhost:3000/health; do
            if [ ${ATTEMPTS} -eq ${MAX_ATTEMPTS} ]; then
              echo "Max attempts reached! Backend failed to start."
              exit 1
            fi
            
            ATTEMPTS=$((ATTEMPTS+1))
            sleep 1
          done
          echo "Backend is up!"

      - name: Run integration test
        run: node scripts/integration-test.mjs

      - name: Stop services
        run: docker compose down
  
  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: brainbytes/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: brainbytes/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max