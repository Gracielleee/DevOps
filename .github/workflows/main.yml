name: BrainBytes CI/CD

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint-and-scan:
    name: Lint and Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            ./frontend/package-lock.json
            ./backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        continue-on-error: true
        run: npm run lint

      - name: Lint backend
        working-directory: ./backend
        continue-on-error: true
        run: npm run lint 

      - name: Frontend audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      - name: Backend audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Snyk frontend scan
        uses: snyk/actions/node@master
        with:
          args: --file=frontend/package.json --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk backend scan
        uses: snyk/actions/node@master
        with:
          args: --file=backend/package.json --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  frontend-test:
    name: Frontend Tests
    needs: lint-and-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Start Application Stack (Docker)
        run: |
          docker compose up -d frontend
          
      - name: Wait for Frontend Container to be Ready
        run: npx wait-on http://localhost:8080 --timeout 60000

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Install Playwright OS Dependencies Only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ./frontend
        run: npx playwright install-deps

      - name: Run Unit Tests
        working-directory: ./frontend
        run: npm test -- --ci

      - name: Publish frontend unit test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Frontend Unit Tests
          path: frontend/test-results/junit.xml
          reporter: jest-junit

      - name: Clean up root-locked build artifacts
        run: sudo rm -rf ./frontend/.next

      - name: Run E2E Tests
        working-directory: ./frontend
        continue-on-error: true
        run: npx playwright test 
        env:
          BASE_URL: http://localhost:3001

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  backend-test:
    name: Backend Tests
    needs: lint-and-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        run: |
          npm test -- --ci \
            --reporters=default \
            --reporters=jest-junit

      - name: Publish backend test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Tests
          path: backend/junit.xml
          reporter: jest-junit

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results

  build:
    name: Build and Push Docker Images
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        run: |
          COMMIT_SHA=${{ github.sha }}
          SHORT_SHA=${COMMIT_SHA:0:7}
          BRANCH=${{ github.ref_name }}
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "owner_lower=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/brainbytes-frontend:latest
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/brainbytes-frontend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/brainbytes-frontend:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BACKEND_URL=http://backend:3000

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/brainbytes-backend:latest
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/brainbytes-backend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/brainbytes-backend:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

