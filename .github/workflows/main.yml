name: BrainBytes CI/CD

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint-and-scan:
    name: Lint and Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            ./frontend/package-lock.json
            ./backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Lint frontend
        working-directory: ./frontend
        run: |
          npm run lint || echo "Frontend linting failed but continuing workflow"

      - name: Lint backend
        working-directory: ./backend
        run: |
          npm run lint || echo "Backend linting failed but continuing workflow"

      - name: Frontend audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      - name: Backend audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Snyk frontend scan
        uses: snyk/actions/node@master
        with:
          args: --file=frontend/package.json --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk backend scan
        uses: snyk/actions/node@master
        with:
          args: --file=backend/package.json --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Start Application Stack (Docker)
        run: |
          docker compose up -d frontend
          
      - name: Wait for Frontend Container to be Ready
        run: npx wait-on http://localhost:8080 --timeout 60000

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Install Playwright OS Dependencies Only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ./frontend
        run: npx playwright install-deps

      - name: Run Unit Tests
        working-directory: ./frontend
        run: npm test -- --ci

      - name: Publish frontend unit test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Frontend Unit Tests
          path: frontend/test-results/junit.xml
          reporter: jest-junit

      - name: Run E2E Tests
        working-directory: ./frontend
        run: |
          npx playwright test || echo "E2E failed but continuing workflow"
        env:
          BASE_URL: http://localhost:3001

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  backend-test:
    name: Backend Tests
    needs: lint-and-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Run backend tests
        working-directory: ./backend
        run: |
          npm test -- --ci \
            --reporters=default \
            --reporters=jest-junit

      - name: Publish backend test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Tests
          path: backend/junit.xml
          reporter: jest-junit

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results

  build:
    name: Build Docker Images
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: brainbytes/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: brainbytes/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max