name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to rollback'
        required: true
        default: 'both'
        type: choice
        options:
          - backend
          - frontend
          - both
      image_tag:
        description: 'Image tag to deploy (e.g., short SHA or version)'
        required: true

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.service }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and sanitize image tag
        id: sanitize-tag
        run: |
          RAW_TAG="${{ github.event.inputs.image_tag }}"
          
          CLEAN_TAG=$(echo "$RAW_TAG" | sed 's/^sha256://' | xargs)
          
          # If longer than 72 chars, take first 7 (short SHA format)
          if [ ${#CLEAN_TAG} -gt 16 ]; then
            CLEAN_TAG="${CLEAN_TAG:0:7}"
          fi
          
          if ! [[ "$CLEAN_TAG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Error: Invalid image tag format: $CLEAN_TAG"
            exit 1
          fi
          
          echo "original_tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "clean_tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "Sanitized tag: $CLEAN_TAG (from $RAW_TAG)"

      - name: Rollback backend
        if: github.event.inputs.service == 'backend' || github.event.inputs.service == 'both'
        run: |
          set -e
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ steps.sanitize-tag.outputs.clean_tag }}"
          echo "Rolling back backend to image tag: $IMAGE_TAG"
          ENCODED_IMAGE="ghcr.io%2F${OWNER_LOWER}%2Fbrainbytes-backend%3A${IMAGE_TAG}"
          
          RESPONSE=$(curl -f -w "\nHTTP_CODE:%{http_code}" -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}&imgURL=${ENCODED_IMAGE}" 2>&1 || true)
          echo "Render response: $RESPONSE"
          
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d':' -f2)
          
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Error: Render rejected the deployment (HTTP $HTTP_CODE)"
            exit 1
          fi
          
          echo "Backend rollback initiated successfully"

      - name: Rollback frontend
        if: github.event.inputs.service == 'frontend' || github.event.inputs.service == 'both'
        run: |
          set -e
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:upper:]')
          IMAGE_TAG="${{ steps.sanitize-tag.outputs.clean_tag }}"
          echo "Rolling back frontend to image tag: $IMAGE_TAG"
          ENCODED_IMAGE="ghcr.io%2F${OWNER_LOWER}%2Fbrainbytes-frontend%3A${IMAGE_TAG}"
          
          RESPONSE=$(curl -f -w "\nHTTP_CODE:%{http_code}" -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}&imgURL=${ENCODED_IMAGE}" 2>&1 || true)
          echo "Render response: $RESPONSE"
          
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d':' -f2)
          
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Error: Render rejected the deployment (HTTP $HTTP_CODE)"
            exit 1
          fi
          
          echo "Frontend rollback initiated successfully"

      - name: Verify Live Backend Deployment
        if: github.event.inputs.service == 'backend' || github.event.inputs.service == 'both'
        run: |
          echo "Waiting for Backend to spin up on Render..."
          for i in {1..12}; do 
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{secrets.RENDER_SERVICE_BE_URL}}/health || echo "000")
            
            if [ "$STATUS" = "200" ]; then
              echo "Success! The backend is live and healthy."
              exit 0
            fi
            
            echo "Backend Attempt $i: Status is $STATUS. Waiting 30 seconds..."
            sleep 30
          done
          
          echo "Error: Backend failed to start within 6 minutes."
          exit 1

      - name: Verify Live Frontend Deployment
        if: github.event.inputs.service == 'frontend' || github.event.inputs.service == 'both'
        run: |
          echo "Waiting for Frontend to spin up on Render..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{secrets.RENDER_SERVICE_FE_URL}}/ || echo "000")
            
            if [ "$STATUS" = "200" ]; then
              echo "Success! The frontend is live and healthy."
              exit 0
            fi
            
            echo "Frontend Attempt $i: Status is $STATUS. Waiting 30 seconds..."
            sleep 30
          done
          
          echo "Error: Frontend failed to start within 6 minutes."
          exit 1