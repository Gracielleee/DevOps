math:
  - question: "what is 1+1"
    answer: "The answer to 1+1 is 2."
  - question: "what is 2+2"
    answer: "The answer to 2+2 is 4."
  - question: "what is the value of pi"
    answer: "Pi (π) is a mathematical constant representing the ratio of a circle's circumference to its diameter. Its value is approximately 3.14159, though it's an irrational number with infinite non-repeating decimal places. Pi is crucial in geometry, trigonometry, and appears in many real-world applications like calculating areas of circular fields, designing roundabouts in cities, and engineering circular structures."
  - question: "how do you calculate the area of a triangle"
    answer: "The area of a triangle is calculated using the formula: Area = ½ × base × height. This formula works for all types of triangles (right, acute, obtuse). In the Philippine curriculum, students learn to identify the base and perpendicular height, which must be measured at a 90-degree angle to the base. For example, if a triangular plot of land has a base of 10 meters and a height of 6 meters, the area would be ½ × 10 × 6 = 30 square meters. This concept is essential for land measurement in rural Philippines and construction projects."
  - question: "what is the quadratic formula"
    answer: "The quadratic formula is a method to solve quadratic equations of the form ax² + bx + c = 0. The formula is: x = (-b ± √(b² - 4ac)) / 2a. The discriminant (b² - 4ac) determines the nature of solutions: positive means two real roots, zero means one real root, negative means two complex roots. In Philippine mathematics education, students learn to identify coefficients a, b, and c, then substitute them into the formula. This is essential for solving physics problems involving projectile motion, which is relevant to understanding ball trajectories in sports like basketball, which is popular in the Philippines."
  - question: "what is the difference between mean, median, and mode"
    answer: "Mean, median, and mode are three measures of central tendency used to describe data sets. The **mean** is the average, calculated by summing all values and dividing by the count. The **median** is the middle value when data is ordered. The **mode** is the most frequently occurring value. For example, in test scores of 85, 90, 90, 95, 100: mean = 92, median = 90, mode = 90. In Philippine education, students learn these concepts for analyzing class performance, survey results, and economic data. The median is often preferred when data has outliers, which is important when analyzing income distribution in the Philippines."
  - question: "how do you convert fractions to decimals"
    answer: "To convert a fraction to a decimal, divide the numerator by the denominator. For example, 3/4 = 3 ÷ 4 = 0.75. For repeating decimals like 1/3 = 0.333..., you can use the bar notation (0.3̅). In Philippine commerce and daily life, understanding these conversions is essential for calculating discounts, tips, and measurements. Students learn to use long division and calculators. For mixed numbers like 2 1/2, convert to improper fraction first (5/2) then divide (5 ÷ 2 = 2.5). This skill is crucial for cooking, shopping, and understanding financial transactions in the Philippines."

history:
  - question: "capital of the philippines"
    answer: "The capital of the Philippines is Manila."
  - question: "when did ww2 end"
    answer: "World War II ended in 1945."
  - question: "who was the first president of the philippines"
    answer: "The first president of the Philippines was Manuel Roxas, who served from July 4, 1946, to April 15, 1948. However, it's important to note that before independence, the Philippines was under American colonial rule. The position of president evolved through different periods: the Malolos Republic (1899) had Emilio Aguinaldo as president, the Commonwealth period (1935-1946) had presidents like Manuel L. Quezon, and finally, upon independence on July 4, 1946, Manuel Roxas became the first president of the sovereign Republic of the Philippines. His presidency was marked by post-WWII reconstruction efforts and the establishment of diplomatic relations with other nations."
  - question: "when did the philippines gain independence"
    answer: "The Philippines gained independence from the United States on July 4, 1946, when the Treaty of Manila was signed. However, the journey to independence was complex: the Philippines declared independence from Spain on June 12, 1898, during the Philippine Revolution led by Emilio Aguinaldo. This independence was initially recognized by the United States but was later contested, leading to the Philippine-American War (1899-1902). The United States formally recognized Philippine independence on July 4, 1946, after World War II. This date is celebrated annually as Independence Day in the Philippines, with parades, flag-raising ceremonies, and patriotic events throughout the country."
  - question: "what was the malolos republic"
    answer: "The Malolos Republic was the first Asian republic, proclaimed on January 23, 1899, in Malolos, Bulacan. It was established after the Philippine Revolution against Spanish colonial rule. The Malolos Constitution was the first written constitution in Asia, establishing a democratic government with separation of powers. The republic had a president (Emilio Aguinaldo), a bicameral legislature, and a judiciary. It lasted only about 10 months before the Philippine-American War began. Despite its short existence, the Malolos Republic is significant as it demonstrated Filipino aspirations for self-governance and democratic principles. The constitution included provisions for freedom of religion, press, and speech, which were progressive for the time."
  - question: "what was the japanese occupation of the philippines"
    answer: "The Japanese occupation of the Philippines lasted from 1942 to 1945 during World War II. Japan invaded the Philippines in December 1941, shortly after the attack on Pearl Harbor. The occupation was marked by hardship, including food shortages, forced labor, and the Bataan Death March, where thousands of American and Filipino prisoners of war died from starvation, disease, and abuse. The Japanese established a puppet government led by Jose P. Laurel. The occupation ended in 1945 when American and Filipino forces liberated the Philippines. This period profoundly affected Filipino national identity and is commemorated annually. The occupation also led to the development of Filipino resistance movements and strengthened the desire for complete independence."
  - question: "who was apolinario mabini"
    answer: "Apolinario Mabini was known as the 'Sublime Paralytic' and is considered the 'Brains of the Revolution' in Philippine history. Born in 1864 in Tanauan, Batangas, he was a brilliant intellectual who became the chief advisor to President Emilio Aguinaldo during the Philippine Revolution against Spain and the Philippine-American War. Despite being born with a physical disability, Mabini was a prolific writer, philosopher, and political thinker. He authored the 'Social Principles of the Philippines' and advocated for a democratic, republican government. His ideas influenced the Malolos Constitution. Mabini was captured by American forces in 1899 and died in 1903. He is remembered as a national hero and his birthday (November 23) is celebrated as a special holiday in the Philippines."

science:
  - question: "what is evaporation"
    answer: "Evaporation is the process where liquid water changes into water vapor."
  - question: "what is precipitation"
    answer: "Precipitation is water falling from the atmosphere as rain, snow, or hail."
  - question: "what is photosynthesis"
    answer: "Photosynthesis is the process by which plants, algae, and some bacteria convert light energy into chemical energy, producing glucose and oxygen from carbon dioxide and water. The general equation is: 6CO₂ + 6H₂O + light energy → C₆H₁₂O₆ + 6O₂. In the Philippines, this process is crucial for agriculture, as crops like rice, corn, and vegetables depend on photosynthesis. The process occurs in chloroplasts, specifically in the chlorophyll molecules. Understanding photosynthesis is important for Philippine farmers, who optimize crop yields through proper sunlight exposure, water management, and fertilizer use. It's also relevant to environmental science, as deforestation in the Philippines reduces photosynthetic capacity, affecting air quality and climate."
  - question: "what is the water cycle"
    answer: "The water cycle describes the continuous movement of water on, above, and below the Earth's surface. The main processes are: evaporation (water turning to vapor), condensation (vapor forming clouds), precipitation (rain, snow, hail), and collection (water gathering in rivers, lakes, oceans). In the Philippines, the water cycle is particularly important due to the country's tropical climate and frequent typhoons. The Philippines receives significant rainfall, which replenishes aquifers and fills reservoirs. Understanding the water cycle helps in managing water resources, preventing floods, and addressing water scarcity. Climate change is affecting the water cycle in the Philippines, with changing rainfall patterns affecting agriculture and daily life."
  - question: "what is the structure of an atom"
    answer: "An atom consists of a nucleus (containing protons and neutrons) surrounded by electrons in orbitals. Protons are positively charged, neutrons are neutral, and electrons are negatively charged. The number of protons determines the element's identity (atomic number). In the Philippines, understanding atomic structure is relevant to nuclear energy discussions, as the Philippines has explored nuclear power as an energy source. The atomic model has evolved from Dalton's solid sphere to Thomson's plum pudding, Rutherford's nuclear model, Bohr's planetary model, and the modern quantum mechanical model. This knowledge is fundamental to chemistry, physics, and understanding materials science, which is important for Philippine industries like electronics manufacturing and pharmaceuticals."
  - question: "what is the difference between mitosis and meiosis"
    answer: "Mitosis and meiosis are both cell division processes but serve different purposes. **Mitosis** produces two identical daughter cells with the same number of chromosomes (46 in humans) and is used for growth, repair, and asexual reproduction. **Meiosis** produces four genetically unique daughter cells with half the number of chromosomes (23 in humans) and is used for sexual reproduction (gamete formation). In the Philippines, understanding these processes is relevant to biology education, genetic counseling, and understanding diseases. Mitosis errors can lead to cancer, while meiosis errors can cause genetic disorders. These concepts are taught in high school biology and are important for understanding heredity, evolution, and biotechnology, which are growing fields in the Philippines."
  - question: "what is the greenhouse effect"
    answer: "The greenhouse effect is the process by which certain gases in Earth's atmosphere trap heat, keeping the planet warm enough to support life. Key greenhouse gases include carbon dioxide (CO₂), methane (CH₄), and water vapor. In the Philippines, the greenhouse effect is particularly relevant due to the country's vulnerability to climate change impacts like typhoons, rising sea levels, and extreme weather. The Philippines contributes to global warming through deforestation, burning of fossil fuels, and waste management. Understanding the greenhouse effect helps in developing climate adaptation strategies, promoting renewable energy, and implementing environmental policies. The Philippines is among the most vulnerable countries to climate change despite contributing relatively little to global emissions, making climate action a national priority."