
services:
  # Frontend container
  frontend:
    build:
      context: ./frontend
      args:
        - BACKEND_URL=http://backend:3000
    ipc: host
    ports:
      - "8080:3001"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=/api/
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:3001 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend API container
  backend:
    build: ./backend
    ports:
      - "3000:3000"
      - "9080:9080" # Prometheus metrics port
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - HF_TOKEN=${HF_TOKEN}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - FE_URL=${FE_URL:-http://localhost:8080,http://frontend:3001}
      - ENABLE_METRICS=true
      - METRICS_AUTH_USERNAME=${METRICS_AUTH_USERNAME}
      - METRICS_AUTH_PASSWORD=${METRICS_AUTH_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 10s        
      timeout: 5s        
      retries: 5        
      start_period: 30s

