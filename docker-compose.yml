
services:
  # Frontend container
  frontend:
    build: ./frontend
    ipc: host
    ports:
      - "8080:3001"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=/api/
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:3000 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend API container
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/brainbytes}
      - JWT_SECRET=my_super_secret_jwt_key
      - FE_URL=http://localhost:8080,http://frontend:3001
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 10s        
      timeout: 5s        
      retries: 5        
      start_period: 30s

