
services:
  # Frontend container
  frontend:
    build: ./frontend
    ports:
      - "8080:3000"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
          - NEXT_PUBLIC_API_URL=http://localhost:3000/api # Points to the backend service
    depends_on:
      - backend
    restart: unless-stopped

  # Backend API container
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - HF_TOKEN=${HF_TOKEN} # Passes the Hugging Face token from .env
    depends_on:
      - mongo
    restart: unless-stopped

  # MongoDB container
  mongo:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

# Define volumes for persistent data
volumes:
  mongo-data:
