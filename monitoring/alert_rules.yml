groups:
- name: BrainBytes Alert
  rules:
  - alert: HighCPUUsage
    expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage detected on {{ $labels.instance }}"
      description: "CPU usage is above 80% for more than 5 minutes."

  - alert: HighMemoryUsage
    expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High Memory usage detected on {{ $labels.instance }}"
      description: "Memory usage is above 80% for more than 5 minutes."

  - alert: LowDiskSpace
    expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Low Disk Space detected on {{ $labels.instance }} at {{ $labels.mountpoint }}"
      description: "Disk space is below 15% for more than 5 minutes."   


  # Application-specific alerts
  - alert: HighErrorRate
    expr: sum( rate(brainbyte_http_requests_total{status=~"5.."}[5m]) * 100 > 5
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High error rate detected on {{ $labels.instance }}"
      description: "Error rate is above 5% for more than 2 minutes." 
  
  - alert: SlowResponseTime
    expr: histogram_quantile(0.95, sum(rate(brainbyte_http_request_duration_seconds_bucket[5m])) by (le)) > 2
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "Slow response time detected on {{ $labels.instance }}"
      description: "95th percentile response time is above 2 seconds for more than 2 minutes."