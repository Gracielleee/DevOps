groups:
  - name: BrainBytes Critical Alerts
    interval: 30s
    rules:
      - alert: AIServiceEmptyResponses
        expr: sum(rate(brainbytes_ai_empty_responses_total[5m])) by (job) > 0.1
        for: 1m
        labels:
          severity: critical
          team: ai-service
        annotations:
          summary: "AI returning empty responses"
          description: "{{ $value | humanizePercentage }} of responses empty"

      - alert: HighErrorRate
        expr: |
          sum(rate(brainbytes_http_requests_total{status=~"5.."}[5m])) by (route_pattern, job)
          / sum(rate(brainbytes_http_requests_total[5m])) by (route_pattern, job) > 0.05
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Error rate >5% on {{ $labels.route_pattern }}"
          description: "{{ $value | humanizePercentage }} of requests failing (5xx)"

      - alert: AIResponseSLOViolation
        expr: |
          histogram_quantile(0.95, sum(rate(brainbytes_ai_response_time_seconds_bucket{status="success"}[5m])) by (subject, le, job)) > 3
        for: 3m
        labels:
          severity: critical
          team: ai-service
        annotations:
          summary: "AI P95 latency violates SLO for {{ $labels.subject }}"
          description: "P95: {{ $value | humanizeDuration }}"

  - name: BrainBytes Warning Alerts
    interval: 30s
    rules:
      - alert: HTTPResponseSLOViolation
        expr: |
          histogram_quantile(0.95, sum(rate(brainbytes_http_request_duration_seconds_bucket[5m])) by (route_pattern, le, job)) > 3
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "HTTP P95 latency >3s on {{ $labels.route_pattern }}"

      - alert: LargeResponsesRiskBandwidth
        expr: |
          histogram_quantile(0.95, sum(rate(brainbytes_response_size_bytes_bucket[5m])) by (endpoint, le, job)) > 100000
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "P95 response size >100KB (endpoint: {{ $labels.endpoint }})"

      - alert: HighConnectionDropRate
        expr: sum(rate(brainbytes_connection_drops_total[5m])) by (reason, job) > 1
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Connection drops >1/sec (reason: {{ $labels.reason }})"

  - name: BrainBytes Resource Alerts
    interval: 30s
    rules:
      - alert: BackendCPUUsageHigh
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Application CPU >85% on {{ $labels.instance }}"

      - alert: ContainerMemoryUsageHigh
        expr: |
          (container_memory_working_set_bytes{container="backend-1"} 
          / container_spec_memory_limit_bytes{container="backend-1"}
          ) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Memory >85% on {{ $labels.container }}"
          description: "Risk of OOM kill"

      - alert: HighActiveSessions
        expr: brainbytes_active_sessions > 5000
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Active sessions >5000"

      - alert: ContainerNetworkErrors
        expr: |
          (rate(container_network_receive_errors_total{container="backend-1"}[5m]) 
          + rate(container_network_transmit_errors_total{container="backend-1"}[5m])
          ) > 10
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Network errors >10/sec on {{ $labels.container }}"

  - name: Infrastructure & Disk Alerts
    interval: 30s
    rules:
      - alert: DiskSpaceRunningOut
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/var/lib"} 
          / node_filesystem_size_bytes{mountpoint="/var/lib"}) < 0.1
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Docker disk usage >90% on {{ $labels.instance }}"
          description: "{{ $value | humanizePercentage }} of disk space available"

      - alert: ContainerRestartingFrequently
        expr: |
          increase(container_last_seen{name="backend-1"}[5m]) > 2
        for: 2m
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "Backend container restarting frequently"
          description: "{{ $value }} restarts detected in 5 minutes"

      - alert: HighDockerContainerCPU
        expr: |
          rate(container_cpu_usage_seconds_total{container="backend-1"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Docker container CPU >80% ({{ $labels.container }})"

      - alert: NodeMemoryPressure
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Node memory pressure >85%"
          description: "{{ $value | humanize }}% memory used"

      - alert: HighLoadAverage
        expr: node_load1 > 4
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Load average >4 on {{ $labels.instance }}"
          description: "Current: {{ $value | humanize }}"